# This workflow creates the PotreeConverter executable
# 4Days SRL
# 20206-01-08
name: CMake on a single platform for PotreeConverter

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
        contents: write
        issues: write
        
    steps:
    
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt install -y libtbb-dev libboost-all-dev ; sudo apt-get install -y software-properties-common && sudo add-apt-repository ppa:ubuntugis/ubuntugis-unstable ; sudo apt-get update ; sudo apt install -y pdal libpdal-dev

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    #- name: Test
    #  working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
    #  run: ctest -C ${{env.BUILD_TYPE}}

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v0
        files: ${{github.workspace}}/build/PotreeConverter

